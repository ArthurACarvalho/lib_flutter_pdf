name: lib_pdf
description: "Gere relatórios PDF escrevendo widgets Flutter comuns: texto real, gráficos vetoriais, paginação automática e visualizador com impressão."
version: 0.1.0
repository: https://github.com/ArthurACarvalho/lib_flutter_pdf

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Só afeta os testes do pacote (disponibiliza MaterialIcons no bundle).
  uses-material-design: true
  assets:
    - fonts/
